services:
  metadata-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metrictrace
      POSTGRES_USER: metrictrace
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:-metrictrace-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrictrace -d metrictrace"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [metadata-data:/var/lib/postgresql/data]
  source-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: source
      POSTGRES_USER: metrictrace_source
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-source-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrictrace_source -d source"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [source-data:/var/lib/postgresql/data, ./infra/source-init.sql:/docker-entrypoint-initdb.d/001-source.sql:ro]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-metrictrace-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-metrictrace-dev-only}
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [minio-data:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/metrictrace-history"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-metrictrace-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-metrictrace-dev-only}
  migrate:
    build: ./backend
    command: alembic -c alembic/alembic.ini upgrade head
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://metrictrace:${METADATA_DB_PASSWORD:-metrictrace-dev-only}@metadata-db:5432/metrictrace
      ENVIRONMENT: development
      AUTH_BYPASS: "true"
      HISTORICAL_STORAGE_BACKEND: s3
      HISTORICAL_S3_BUCKET: metrictrace-history
      HISTORICAL_S3_ENDPOINT_URL: http://minio:9000
      HISTORICAL_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-metrictrace-dev}
      HISTORICAL_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-metrictrace-dev-only}
    depends_on:
      metadata-db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    build: ./backend
    command: python -m app.workers
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
  scheduler:
    build: ./backend
    command: python -m app.workers.scheduler
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      BACKEND_API_URL: http://api:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_placeholder}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder}
    depends_on:
      api: {condition: service_healthy}
volumes:
  metadata-data:
  source-data:
  minio-data:
