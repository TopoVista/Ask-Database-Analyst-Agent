version: "1"

services:
  - type: web
    name: ask-database-analyst
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    numInstances: 1

    envVars:
      # ── Required secrets (set in Render dashboard, never commit) ──────────
      - key: OPENAI_API_KEY
        sync: false          # injected from Render environment group

      # ── App tuning ────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        sync: false          # managed PostgreSQL URL; never fall back to SQLite in production

      - key: ENCRYPTION_KEY
        sync: false          # Fernet key used to encrypt user database credentials

      - key: CLERK_ISSUER
        sync: false          # e.g. https://<instance>.clerk.accounts.dev

      - key: ALLOWED_ORIGINS
        sync: false          # comma-separated Vercel production/custom-domain origins

      - key: AUTH_BYPASS
        value: "false"

      - key: MAX_QUERY_ROWS
        value: "500"

      # Conservative concurrency and payload caps for the 512 MB free tier.
      # Simulation and evaluation are deterministic; these bounds protect the
      # remaining query/specialist paths from concurrent memory spikes.
      - key: MAX_CONCURRENT_AGENT_RUNS
        value: "1"

      - key: MAX_CONCURRENT_DB_QUERIES
        value: "1"

      - key: AGENT_MAX_ITERATIONS
        value: "3"

      - key: AGENT_TIMEOUT_SECONDS
        value: "60"

      - key: QUERY_TIMEOUT_SECONDS
        value: "20"

      - key: SCHEMA_MAX_TABLES
        value: "50"

      - key: SCHEMA_TIMEOUT_SECONDS
        value: "15"

      - key: MAX_QUERY_RESULT_BYTES
        value: "1048576"

      - key: MAX_SPECIALIST_ROWS
        value: "250"

      - key: MAX_SPECIALIST_COLUMNS
        value: "5"

      - key: LOG_LEVEL
        value: warning       # reduce noise / memory overhead in prod

      - key: PYTHONOPTIMIZE
        value: "1"
